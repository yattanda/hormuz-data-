name: Update Manual Data (AI estimate)

on:
  schedule:
    - cron: '30 0 * * *'  # 毎日 09:30 JST
  workflow_dispatch:

jobs:
  fetch-manual:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-genai

      # 推計に使うモデルはリポジトリの変数 SCENARIO_BACKEND（claude / gemini。未設定なら claude）
      - name: Install Claude Code CLI
        if: vars.SCENARIO_BACKEND != 'gemini'
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch and analyze news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCENARIO_BACKEND: ${{ vars.SCENARIO_BACKEND }}
        # 本番は 09:30 JST の cron-job.org からの起動（workflow_dispatch）。
        # GitHub の予約実行は数時間遅れて動く予備なので、今日すでに更新済みなら何もしない
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/fetch_manual.py --skip-if-updated-today
          else
            python scripts/fetch_manual.py
          fi

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # data/ais-snapshot.json は実測専用（update_ais.yml が書く）。ここでは絶対に触らない
          git add data/manual-update.json data/ais-estimate.json
          git diff --staged --quiet || git commit -m "chore: update manual + AIS推計 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
