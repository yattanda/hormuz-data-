name: Update Manual Data (AI estimate)

on:
  schedule:
    - cron: '30 0 * * *'  # 毎日 09:30 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: '試し実行（ファイルを書かず、コミットもしない。結果はログに出す）'
        type: boolean
        default: false

jobs:
  fetch-manual:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 推計は Claude（Claude Code の CLI）。Gemini の経路は 2026-10-26 に外した（Python の追加パッケージは不要）
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch and analyze news
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # 本番は 09:30 JST の cron-job.org からの起動（workflow_dispatch）。
        # GitHub の予約実行は数時間遅れて動く予備なので、今日すでに更新済みなら何もしない
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/fetch_manual.py --skip-if-updated-today
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/fetch_manual.py --dry-run
          else
            python scripts/fetch_manual.py
          fi

      - name: Commit and push
        if: inputs.dry_run != true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 隻数の AI 推計（data/ais-estimate.json）は 2026-10 の見直しで書かなくなった（PortWatch で測る）
          # 予測の記録（data/scenario-log.jsonl）は推計のたびに1行増える。採点に使う（scripts/score_scenarios.py）
          git add data/manual-update.json data/scenario-log.jsonl
          git diff --staged --quiet || git commit -m "chore: update manual $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      # 食い違いの検査と採点。WARN はこの実行の要約に出す。推計が失敗した日も、
      # 今あるファイルで検査する。ここが失敗してもワークフローは止めない
      - name: Check consistency
        if: always()
        continue-on-error: true
        run: |
          python scripts/check_consistency.py || echo "::warning::check_consistency.py が失敗しました"
          python scripts/score_scenarios.py || echo "::warning::score_scenarios.py が失敗しました"
