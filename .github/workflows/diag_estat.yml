name: Diagnose e-Stat classification codes

# fetch_oil_flow.py が使う分類コードを、実際のAPIレスポンスで確認するための
# 手動実行専用ワークフロー。ローカルに appId を置かずに済ませるためのもの。
# command=scenario_noise は、シナリオ確率のばらつきを測る（tools/diag_scenario_noise.py・
# ファイルは書かない）。workflow_dispatch は default ブランチにあるファイルしか起動できないため、
# 別のワークフローにせずここに置く。
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'list（統計表を検索）または meta（分類コードを表示）'
        required: true
        default: 'list'
        type: choice
        options:
          - list
          - meta
          - dryrun
          - baseline
          - scenario_noise
      stats_data_id:
        description: 'command=meta / dryrun のときの統計表ID（dryrun は省略可）'
        required: false
        default: ''
      noise_args:
        description: 'command=scenario_noise のときの引数'
        required: false
        default: '--variants legacy,new1,newN --runs 5 --samples 5 --repeats 3'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests google-genai

      - name: Measure scenario probability noise
        if: inputs.command == 'scenario_noise'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python tools/diag_scenario_noise.py ${{ inputs.noise_args }}

      - name: Run diagnosis
        if: inputs.command == 'list' || inputs.command == 'meta'
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          python tools/diag_estat.py "${{ inputs.command }}" ${{ inputs.stats_data_id }}

      - name: Dry-run fetch (国別×月別の内訳を表示。JSONは更新しない)
        if: inputs.command == 'dryrun'
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          if [ -n "${{ inputs.stats_data_id }}" ]; then
            python scripts/fetch_oil_flow.py --dry-run --table "${{ inputs.stats_data_id }}"
          else
            python scripts/fetch_oil_flow.py --dry-run
          fi

      - name: Recompute baseline (normal_total_bpd)
        if: inputs.command == 'baseline'
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          python scripts/fetch_oil_flow.py --baseline

      - name: Commit baseline
        if: inputs.command == 'baseline'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/oil-flow.json
          git diff --staged --quiet || git commit -m "chore: recompute normal_total_bpd $(date -u '+%Y-%m-%dT%H:%MZ')"
          git push
